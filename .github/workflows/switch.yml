name: Nintendo Switch Build
# Disabled: devkitPro provides no SDL3 portlib yet, so the Switch build cannot be
# migrated off SDL2. Run manually once an SDL3 portlib is available.
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Build
      run: |
        mkdir -p out/switch
        cd out/switch
        /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-cmake -DCMAKE_BUILD_TYPE=Release ../../
        make -j4
        mkdir system3
        mv system3.* system3/

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: system3-switch
        path: out/switch/system3
