name: Windows Build
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "system3-sdl2-64bit"
            sdl-version: 2
            sdl-deps: "SDL2:p SDL2_ttf:p"
          - package: "system3-sdl3-64bit"
            sdl-version: 3
            sdl-deps: "sdl3:p sdl3-ttf:p"
    defaults:
      run:
        shell: msys2 {0}
    name: MSYS2 SDL${{ matrix.sdl-version }}
    steps:

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        pacboy: >-
          ${{ matrix.sdl-deps }}
          rtmidi:p
          nlohmann-json:p

    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Copy licenses
      run: |
        ls /ucrt64/share/licenses
        mkdir dist
        cp -r /ucrt64/share/licenses dist/
        cp resources/fonts/*.license dist/licenses/
        cp deps/ymfm/LICENSE dist/licenses/ymfm.license

    - name: Install dev dependencies
      run: pacboy --noconfirm -S --needed gcc:p cmake:p ninja:p

    - name: Build
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=YES \
          -DSYSTEM3_SDL_VERSION=${{ matrix.sdl-version }}
        cmake --build build

    - name: Test
      run: ctest --output-on-failure --test-dir build

    - name: Package
      run: |
        cp build/system3.exe COPYING.txt dist/

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.package }}
        path: dist
        compression-level: 9  # because we use it for releases
